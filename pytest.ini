[pytest]
# Pytest configuration for combine-blink project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Test paths
testpaths = tests
norecursedirs = tests/manual

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    -ra
    --disable-warnings

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require external services or files)
    slow: Slow-running tests (>1 second)
    requires_ffmpeg: Tests that require ffmpeg installed
    requires_models: Tests that require ML models downloaded
    requires_video_files: Tests that require actual video files
    manual: Tests that require manual intervention or review

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options (if using pytest-cov)
# Uncomment to enable coverage reporting
# addopts = --cov=blink_pipeline --cov-report=html --cov-report=term

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
