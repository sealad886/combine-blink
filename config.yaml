paths:
  input_dir: /Volumes/scritch/blink/25-10/25-10-15
  output_dir: output
  videos_dir: merged_videos
  transcripts_dir: transcripts
  speakers_dir: speaker_voice_samples
discovery:
  filename_pattern: (\d{2}-\d{2}-\d{2})_([a-zA-Z0-9]+)G.+\.mp4
  date_folder_patterns:
  - '%Y-%m-%d'
  - '%Y%m%d'
  - '%Y_%m_%d'
  - '%y-%m-%d'
  - '%y%m%d'
  - '%y_%m_%d'
  - '%m-%d-%y'
  - '%d-%m-%y'
grouping:
  max_time_diff_seconds: 300
multi_camera_composition:
  # Enable multi-camera composition (set to false to use old sequential merge)
  enable_composition: true

  # FEATURE FLAG: Use modular composition architecture (refactored)
  # Set to false to use original monolithic implementation
  # This flag enables progressive rollout with instant rollback capability
  use_modular_composition: true

  # Switching strategy: how to decide which camera to show when
  # Options: 'time_based', 'round_robin', 'audio_quality', 'speech_people'
  # - time_based: Switch cameras at regular intervals
  # - round_robin: Cycle through all available cameras equally
  # - audio_quality: Prefer cameras with better audio at each moment
  # - speech_people: Use diarized speech to anchor the speaking camera; when silent, switch to the angle with the most people and flag a review indicator (requires people detection)
  switching_strategy: speech_people

  # How often to switch cameras (in seconds) for time_based/round_robin strategies
  switching_interval: 5.0

  # Transition style between camera angles
  # Options: 'cut', 'crossfade'
  # Note: 'cut' is instant, 'crossfade' requires re-encoding (slower but smoother)
  transition_style: cut

  # Duration of transitions in seconds (only used if transition_style is 'crossfade')
  transition_duration: 0.28

  # Crossfade duration between consecutive audio segments (seconds)
  audio_crossfade_seconds: 0.06

  # Audio source selection strategy
  # Options: 'best_quality', 'first', 'longest'
  # - best_quality: Use clip with highest audio quality score
  # - first: Use the first clip chronologically
  # - longest: Use the longest duration clip
  audio_source: best_quality

  # Weight individual metrics when ranking audio (should sum to ~1.0)
  audio_quality_weights:
    rms: 0.4          # Overall loudness within a healthy speech range
    peak: 0.2         # Penalize clipping when peaks approach 0 dBFS
    noise: 0.2        # Reward larger gap between average level and noise floor
    clipping: 0.3     # Penalize repeated peak hits indicative of distortion

  # Clean up the selected audio track before stitching segments
  # MPS optimization: Audio cleanup is ffmpeg-based and runs efficiently on all platforms
  audio_cleanup:
    enabled: true
    highpass_hz: 80         # kHz # Slightly lower for more natural bass (was 120)
    lowpass_hz: 4000         # kHz # Extended to 8kHz for better clarity on speech (was 7000)
    denoise: true            # Apply fft-based denoiser (afftdn)
    denoise_nf: -25.0        # Noise floor reference (dB) for denoiser
    loudness_normalize: true # Per-segment loudness normalization (loudnorm)
    loudnorm_target_i: -23.0 # Slightly louder target for better audibility (was -24.0)
    loudnorm_target_tp: -2.0
    loudnorm_target_lra: 11.0
    extra_filters: []        # Optional list of additional ffmpeg audio filters

  # Estimate how many people are visible in each angle to guide silent segments
  # Backend options:
  #   - 'auto': Automatically select best available (Vision on macOS, HuggingFace otherwise)
  #   - 'vision': Apple Vision framework (fastest, uses Neural Engine, macOS-only)
  #   - 'huggingface': Hugging Face transformers (YOLOS/DETR with MPS support)
  #
  # Vision backend (recommended for macOS):
  #   - Ultra-fast, native Apple Silicon Neural Engine acceleration
  #   - No model downloads, minimal GPU memory usage
  #   - Requires: pyobjc-framework-Vision (pip install pyobjc-framework-Vision pyobjc-framework-Quartz)
  #
  # HuggingFace backend:
  #   - Cross-platform, GPU-accelerated (MPS on Apple Silicon, CUDA on NVIDIA)
  #   - Requires model download (~40MB for YOLOS-tiny)
  #   - Configurable models: hustvl/yolos-tiny (fast) or facebook/detr-resnet-50 (accurate)
  people_detection:
    enabled: true
    backend: vision              # 'auto', 'vision', or 'huggingface'
    sample_frames: 12           # Slightly fewer frames for speed on Apple Silicon
    resize_width: 480          # Keeps MPS fast while preserving detail (HuggingFace only)
    min_frame_width: 320       # Minimum width to avoid undersized frames
    # HuggingFace backend options:
    model_name: hustvl/yolos-tiny  # YOLOS (fast) or facebook/detr-resnet-50 (accurate)
    revision: null                 # For DETR: 'no_timm' to avoid timm dependency; null for YOLOS
    score_threshold: 0.65      # Detection confidence threshold (0.0-1.0)
    min_count: 1               # Minimum people-count to consider angle for silent intervals

  # Fine audio alignment (cross-correlation) to reduce per-camera offset
  # Uses a short window of audio from overlapping clips to estimate per-camera time shift
  # Note: Estimates a single offset per camera for the entire event; may not fully correct
  # drift within longer clips. For best results, keep clips short (<60s) or disable if problematic.
  # MPS optimization: Reduced window/hop for faster processing; alignment is CPU-bound (numpy)
  audio_alignment:
    enabled: true
    max_shift_seconds: 1.5          # Maximum shift to apply (prevents overcorrection)
    analysis_window_seconds: 12.0   # Reduced from 12s for faster processing (still accurate)
    hop_seconds: 6.0                # Reduced from 6s for faster multi-window analysis
    sample_rate: 48000              # Downsample rate for faster cross-correlation
    bandpass: true                  # Apply bandpass filter to focus on speech frequencies
    highpass_hz: 80                # High-pass filter cutoff (removes low rumble)
    lowpass_hz: 8000                # Low-pass filter cutoff (removes high noise)
    estimate_drift: true            # Estimate slow drift (seconds per second) and correct in audio

  # Burn date/time overlay in bottom-right; Blink files are often off by 1 hour (DST)
  timestamp_overlay:
    enabled: true
    font: Arial
    font_size: 24
    margin_v: 20
    margin_r: 20
    dst_offset_hours: 1

  # Performance and encoding controls
  # single_pass_filter_complex: Compose in one ffmpeg invocation (faster, default true)
  # MPS OPTIMIZATION: Enabled for 5-10x faster composition on Apple Silicon
  single_pass_filter_complex: true
  encoding:
    # MPS optimization: Use VideoToolbox hardware encoding on macOS for ~5-10x faster encoding
    # with excellent quality. Falls back to software if hardware encoder unavailable.
    use_hw_encode: true         # Enable hardware encoding on macOS (h264_videotoolbox)
    hw_codec: h264_videotoolbox # VideoToolbox for Apple Silicon/Intel Macs
    
    # MPS OPTIMIZATION: Use constant quality mode for better speed/quality tradeoff
    # quality: 1-100 scale (higher = better quality)
    #   - 50-60: Fast, good quality for previews
    #   - 65-75: Excellent quality, recommended for final output
    #   - 80+: Near-lossless, larger file sizes
    # If not set, falls back to bitrate mode (below) for backward compatibility
    quality: 70                 # Constant quality mode (FFmpeg 4.4+)
    
    # Legacy bitrate mode (used only if quality not set)
    bitrate: 8000k              # VideoToolbox target: 8Mbps for excellent 1080p quality (up from 6Mbps)
    
    # Pixel format: yuv420p (compatible) or p010le (10-bit, newer Macs only)
    pix_fmt: yuv420p           # Compatible pixel format for all devices
    
    # Software encoding fallback settings (rarely used when VideoToolbox available)
    x264_preset: null         # Software fallback: 'faster' balances speed/quality (upgrade from 'veryfast')
    x264_crf: null              # Software fallback: CRF 20 for higher quality (down from 22)
video_processing:
  crossfade_duration: 0.5
transcription:
  # Video Validation & Repair (Stage 0 - Preprocessing)
  # All discovered videos are validated and repaired upfront before transcription.
  # This ensures each video is repaired exactly once, with results cached for subsequent runs.

  # always_repair: If true, repair all videos regardless of detected issues.
  #                If false, only repair videos with audio/video sync issues (>100ms difference).
  always_repair: false

  # repair_cache_dir: Single unified cache directory for all repaired videos.
  #                   Cached repairs are reused across runs, avoiding duplicate processing.
  repair_cache_dir: output/repaired_cache

  # repair_strategy: How to handle damaged/corrupted video frames
  #   - 'fill': Duplicate last good frame for missing sections (recommended for most cases)
  #   - 'remove_blank': Remove blank/static frames using mpdecimate filter
  repair_strategy: fill

  whisper:
    # Prefer whisper.cpp on macOS when ggml_model_path is configured (defaults to true on Darwin)
    # Set to false to force use of openai-whisper even when whisper.cpp is available
    prefer_whisper_cpp: true

    # Force language to avoid auto-detection errors (e.g., 'en' for English, 'es' for Spanish)
    # Set to null or omit for auto-detection
    language: en

    # Core ML Configuration (Apple Silicon only - M1/M2/M3):
    # ggml_model_path: Path to the Core ML encoder model (.mlmodelc or .mlpackage)
    #   - .mlmodelc: Pre-compiled Core ML model (ready to use, fastest)
    #   - .mlpackage: Uncompiled Core ML model (auto-compiles on first use, requires Xcode CLI tools)
    #
    # To set up Core ML:
    # 1. Install pywhispercpp with Core ML: WHISPER_COREML=1 pip install git+https://github.com/absadiki/pywhispercpp
    # 2. Convert model: cd whisper.cpp/models && ./generate-coreml-model.sh medium.en
    #    This creates: models/coreml-encoder-medium.en.mlpackage
    # 3. Set path below to the .mlpackage (auto-compiles to .mlmodelc) or pre-compiled .mlmodelc
    # 4. Set device: coreml
    #
    # Example paths:
    #   ggml_model_path: /path/to/whisper.cpp/models/coreml-encoder-medium.en.mlmodelc  # Pre-compiled
    #   ggml_model_path: /path/to/whisper.cpp/models/coreml-encoder-medium.en.mlpackage # Will auto-compile
    #
    # For non-Core ML (CPU/GPU/Metal):
    #   ggml_model_path: /path/to/whisper.cpp/models/ggml-medium.en.bin  # Standard GGML model
    #   device: auto  # or cpu, cuda, metal
    ggml_model_path: /Users/andrew/zzCoding-play/whisper.cpp/models/ggml-large-v3-turbo.bin

    # Path to whisper.cpp binary (auto-detected if in PATH or standard locations)
    # Leave commented out for auto-detection, or specify explicit path:
    whisper_cpp_binary: /Users/andrew/zzCoding-play/whisper.cpp/build/bin/whisper-cli

    # Device for inference:
    #   - 'coreml': Core ML acceleration (Apple Silicon only, requires .mlmodelc or .mlpackage path)
    #   - 'auto': Automatically select best available (Metal on macOS, CUDA on Linux/Windows with GPU)
    #   - 'cpu': CPU-only inference
    #   - 'cuda': NVIDIA GPU acceleration (requires CUDA build)
    #   - 'metal': Metal GPU acceleration (macOS)
    device: coreml

    beam_size: 5
    temperature: 0.0
  diarization:
    model_id: pyannote/speaker-diarization-3.1
    auth_token_env:
    - HF_TOKEN
    - HUGGINGFACE_TOKEN
    min_overlap_ratio: 0.6

# Audio Enhancement (Stage 3 - Pre-Transcription)
# Advanced neural network-based audio enhancement applied before transcription
# to improve speech recognition accuracy in noisy environments.
#
# This is separate from audio_cleanup (Stage 5) which handles composition audio.
# Enhancement happens once per clip before transcription and is cached.
audio_enhancement:
  # Master enable/disable switch
  # Set to false to skip all audio enhancement (faster, lower quality transcription)
  enabled: true

  # Cache directory for enhanced audio files
  # Enhanced audio is cached to avoid reprocessing on subsequent runs
  # Cache is invalidated when configuration changes
  cache_dir: output/enhanced_audio_cache

  # DeepFilterNet Settings
  # Neural network-based noise reduction for speech enhancement
  # Uses deep learning to remove background noise while preserving speech
  deepfilternet:
    # Enable DeepFilterNet denoising
    enabled: true

    # Model selection: DeepFilterNet, DeepFilterNet2, DeepFilterNet3
    # - DeepFilterNet: Original model, fastest, good quality
    # - DeepFilterNet2: Improved model, balanced speed/quality
    # - DeepFilterNet3: Latest model, best quality, slightly slower
    # Recommended: DeepFilterNet3 for best results
    model: DeepFilterNet3

    # Post-filter: Additional noise attenuation stage
    # Provides extra noise reduction but may affect speech naturalness
    # Recommended: false for natural sound, true for maximum noise reduction
    post_filter: false

    # Post-filter beta (0.0-0.05): Aggressiveness of post-filter
    # Only used if post_filter is enabled
    # Higher = more aggressive noise reduction (may affect speech quality)
    # Lower = more natural sound but less noise reduction
    # Recommended: 0.02 for balanced results
    pf_beta: 0.02

    # Attenuation limit in dB (0-100)
    # Controls how much noise can be reduced
    # Lower values preserve more of the original signal
    # 10 = conservative (preserve speech naturalness)
    # 50 = moderate (balanced)
    # 100 = full attenuation (maximum noise reduction, may affect speech)
    # Recommended: 10 for speech transcription to preserve quality
    atten_lim_db: 10

    # Minimum processing threshold in dB (-15 to 35)
    # Audio below this level is not processed by DeepFilterNet
    # Useful to skip very quiet sections or noise floor
    # Recommended: -10.0 for typical speech scenarios
    min_thresh: -10.0

    # Maximum ERB buffer threshold in dB (-15 to 35)
    # Advanced parameter controlling ERB (Equivalent Rectangular Bandwidth) processing
    # Higher values allow more frequency content through
    # Recommended: 30.0 (default, rarely needs adjustment)
    max_erb_thresh: 30.0

    # Maximum deep filtering threshold in dB (-15 to 35)
    # Advanced parameter controlling deep filtering stage intensity
    # Higher values = less aggressive filtering
    # Recommended: 20.0 (default, rarely needs adjustment)
    max_df_thresh: 20.0

  # VAD-based Pregain Normalization
  # Uses Voice Activity Detection (Silero VAD) to identify and normalize speech
  # Analyzes only speech segments to calculate optimal gain, avoiding noise amplification
  # Applied BEFORE DeepFilterNet to ensure speech is at optimal level for denoising
  vad_pregain:
    # Enable VAD-based pregain normalization
    # Highly recommended for noisy or quiet audio
    enabled: true

    # Target RMS level (0.0-1.0) for speech segments
    # Controls how loud the speech should be after normalization
    # 0.9 = high level for clear, strong speech (recommended for noisy environments)
    # 0.5 = moderate level for balanced dynamics
    # 0.2-0.3 = lower level for natural dynamics (good for already clean audio)
    #
    # Higher values improve DeepFilterNet performance but may reduce dynamics
    # Recommended: 0.9 for noisy Blink camera audio
    target_rms: 0.9

    # VAD probability threshold (0.0-1.0)
    # Controls how strict the Voice Activity Detection is
    # Higher = stricter speech detection (fewer false positives, may miss quiet speech)
    # Lower = more permissive (catches quieter speech, may include noise)
    #
    # 0.05 = very permissive (good for quiet speakers or distant audio)
    # 0.5 = balanced (good default for most scenarios)
    # 0.8 = strict (only very clear speech detected)
    #
    # Recommended: 0.05 for Blink camera audio (often has quiet speech)
    vad_threshold: 0.05

speaker_identification:
  embedding_model_id: pyannote/wespeaker-voxceleb-resnet34-LM
  auth_token_env:
  - HF_TOKEN
  - HUGGINGFACE_TOKEN
  # MPS optimization: Use 'mps' device for Apple Silicon GPU acceleration
  # Options: 'cpu', 'cuda', 'mps' (Apple Silicon), 'GPU' (auto-detect)
  device: mps
  # Prefer MPS over CUDA on macOS when device is 'auto'
  prefer_mps_on_mac: true
  similarity_threshold: 0.68
speakers:
  known_speakers: {}
concurrency:
  # MPS optimization: Tuned for Apple Silicon Macs with fast SSD and unified memory

  # Stage 0: Video validation and repair (I/O-bound, uses ffmpeg)
  # Increased for faster preprocessing on fast SSDs (Apple Silicon Macs have excellent I/O)
  validation_workers: 6

  # Stage 3: Transcription and diarization (compute-bound, uses AI models)
  # Keep at 2 to avoid memory pressure; Core ML and MPS models use significant unified memory
  # Each worker loads Whisper + diarization models (~4-6GB per worker)
  transcription_workers: 2

  # Stage 5: Video merging and composition (I/O-bound, uses ffmpeg with VideoToolbox)
  # MPS OPTIMIZATION: Increased to 4 for parallel hardware encoding
  # VideoToolbox offloads to Media Engine which can handle multiple streams efficiently
  # Apple Silicon's dedicated video encoders can process 4+ compositions in parallel
  merge_workers: 4

# Logging configuration
logging:
  # Directory for log files (relative to project root or absolute path)
  log_dir: logs

  # Minimum log level to record
  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
  # - DEBUG: Very detailed, useful for troubleshooting
  # - INFO: General information about pipeline execution (recommended)
  # - WARNING: Only warnings and errors
  # - ERROR: Only errors and critical issues
  log_level: DEBUG
